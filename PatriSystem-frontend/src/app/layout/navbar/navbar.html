<aside class="sidebar">
  <div class="sidebar-header">
    <mat-icon class="brand-icon">inventory_2</mat-icon>
    <span class="brand-text">PatriSystem</span>
  </div>

  <nav class="sidebar-links">
    @for (link of links; track link.path) {
      <a class="sidebar-link" [routerLink]="link.path" routerLinkActive="active-link" [matTooltip]="link.label" [matTooltipDisabled]="!collapsed()" matTooltipPosition="right">
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="link-text">{{ link.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    @if (isAuthenticated()) {
      <button class="sidebar-link logout-link" type="button" (click)="logout()" [matTooltip]="'Cerrar sesión'" [matTooltipDisabled]="!collapsed()" matTooltipPosition="right">
        <mat-icon>logout</mat-icon>
        <span class="link-text">Cerrar sesión</span>
      </button>
    }

    <button class="toggle-btn" type="button" (click)="toggleCollapsed()">
      <mat-icon>{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>
</aside>
