<h2 mat-dialog-title>Confirmar Venta</h2>

<mat-dialog-content>
  <p class="subtitle">
    ¿Estás seguro de registrar esta venta?
  </p>
  <div class="summary">
    <div class="summary-item">
      <span>Productos:</span>
      <strong>{{ data.items }}</strong>
    </div>
    <div class="summary-item">
      <span>Total:</span>
      <strong>{{ data.total | currency:'COP':'symbol':'1.0-0' }}</strong>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-cancel" (click)="cancel()" type="button">Cancelar</button>
  <button class="btn-confirm" cdkFocusInitial (click)="confirm()" type="button">Confirmar</button>
</mat-dialog-actions>
